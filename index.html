<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Showdown Live Editor</title>

  <link href='https://fonts.googleapis.com/css?family=Old+Standard+TT:400,400italic,700' rel='stylesheet'
    type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700,600' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/foundation/5.5.2/css/foundation.min.css">
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">

  <link rel="apple-touch-icon" sizes="57x57" href="img/apple-touch-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="img/apple-touch-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="img/apple-touch-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="img/apple-touch-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="img/apple-touch-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="img/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="img/apple-touch-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="img/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" href="img/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="img/android-chrome-192x192.png" sizes="192x192">
  <link rel="icon" type="image/png" href="img/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/png" href="img/favicon-16x16.png" sizes="16x16">
  <link rel="manifest" href="manifest.json">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-TileImage" content="img/mstile-144x144.png">
  <meta name="theme-color" content="#ffffff">
</head>

<body data-ng-controller="editorCtrl">

  <nav class="top-bar" data-topbar ng-hide="readerMode" role="navigation" data-ng-include="'partials/nav.html'"></nav>

  <div id="editor-wrapper" ng-class="{'container': !readerMode, 'container-rd': readerMode}">
    <textarea id="editor" ng-hide="readerMode" data-ng-model="text"></textarea>
    <div id="preview" ng-class="{'preview': !readerMode, 'preview-rd': readerMode}" markdown-to-html="text"></div>

    <!-- 这个 div 只在 readerMode 为 true 时存在 -->
    <div ng-if="readerMode" class="reader-mode-hover-area" ng-mouseenter="showExitButton = true"
      ng-mouseleave="showExitButton = false">
      <!-- 这个按钮只在鼠标悬浮在上述区域时显示 -->
      <button ng-show="showExitButton" class="exit-reader-button" ng-click="toCleanRead()">
        <i class="fa fa-times"></i>
      </button>
    </div>
  </div>
  <div class="lateral-menu toggle-menu-close" pageslide ps-open="checked" ps-side="left" ps-body-class="squeezed-body">
    <div class="lateral-menu-content">
      <div class="title">Options</div>
      <div class="lateral-menu-content-inner">

        <div ng-repeat="opt in checkOpts">
          <input id="checkOpt-{{$id}}" ng-click="updateOptions(); repaint();" type="checkbox" ng-model="opt.value" />
          <label for="checkOpt-{{$id}}" class="inline">{{opt.name}}</label>
        </div>
        <hr>
        <div ng-repeat="opt in numOpts">
          <label for="option-{opt.name}">{{opt.name}}</label>
          <input id="option-{opt.name}" ng-change="updateOptions(); repaint();" type="number" ng-model="opt.value" />
        </div>
        <div ng-repeat="opt in textOpts">
          <label for="option-{opt.name}">{{opt.name}}</label>
          <input id="textOption-{opt.name}" data-ng-change="updateOptions(); repaint();" type="text"
            ng-model="opt.value" />
        </div>
        <div>
          <label for="showdownVersion">Showdown Version</label>
          <select id="showdownVersion" ng-model="version" ng-options="v for v in versions"
            ng-change="loadVersion()"></select>
        </div>
      </div>
    </div>
  </div>

  <!-- modal -->
  <div data-ng-hide="!showModal" class="modal-wrapper ng-hide">
    <div class="modal-inner" aria-labelledby="modalTitle" aria-hidden="true" role="dialog">
      <div class="modal-topbar">
        <span><i>&nbsp;&nbsp;Limited to 1000 characters</i></span><a class="modal-close-btn" aria-label="Close"
          data-ng-click="showModal = false"><i class="fa fa-lg fa-close"></i></a>
      </div>
      <div class="link-area">
        <textarea id="dlnk" style="resize: none;">{{hashTxt}}</textarea>
      </div>
    </div>
  </div>
  <!-- end modal -->

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-sanitize.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-animate.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-cookies.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-pageslide-directive/2.2.0/angular-pageslide-directive.js"
  integrity="sha256-FW2YsacWIn83+j6c02CWOR8fuY4WyzbmmGwz7VOdEI0=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/showdownjs/showdown@master/dist/showdown.min.js"></script>
  <!-- 引入 pdfmake 库 -->
  <!-- 1. 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@latest/build/pdfmake.min.js"></script>
  <!-- 2. 字体文件 (必须，用于支持非拉丁字符) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/pdfmake@latest/build/vfs_fonts.min.js"></script> -->
  <script src="js/source-han-sans-cn_vfs_fonts.js"></script>
  <!-- 3. HTML转pdfmake定义库 -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-pdfmake/browser.js"></script>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/cure53/DOMPurify@main/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
  <script src="js/SourceHanSansCN-VF-normal.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/eKoopmans/html2pdf.js@main/dist/html2pdf.bundle.min.js"></script>

  <script src="js/semver.js"></script>
  <script src="js/editor.js"></script>
</body>

</html>
